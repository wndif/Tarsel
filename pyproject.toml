[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarsel2"
version = "2.0.0"
description = "Fault localization for single-fault Verilog designs (VCS/URG backend)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xiankai Meng" },
    { name = "JiangWu" },
]
keywords = ["verilog", "fault-localization", "vcs", "urg", "eda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tarsel2 = "tarsel2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
